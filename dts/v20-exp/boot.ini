odroidgoa-uboot-config

########################################################################
# V20 EXP : DSI off + broken-cd + initrd gzip BRUT (pas uImage).
# booti addr:filesize — le header mkimage cassait le unpack noyau.
########################################################################

setenv bootargs "root=/dev/mmcblk0p2 rootwait rw fsck.mode=skip net.ifnames=0 fbcon=map:9 vt.global_cursor_default=0 console=/dev/ttyFIQ0 loglevel=7 rdinit=/init nosplash plymouth.enable=0 consoleblank=0 systemd.show_status=true max_cpufreq=1296 boot_cpufreq=1248 max_gpufreq=520 max_ddrfreq=666"

setenv loadaddr "0x02000000"
setenv initrd_loadaddr "0x01100000"
setenv dtb_loadaddr "0x01f00000"

load mmc 1:1 ${loadaddr} Image
load mmc 1:1 ${dtb_loadaddr} rk3326-r36s-v20-linux.dtb
load mmc 1:1 ${initrd_loadaddr} initrd.gz

booti ${loadaddr} ${initrd_loadaddr}:${filesize} ${dtb_loadaddr}
